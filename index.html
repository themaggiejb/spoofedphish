<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        background-image: url("index_background2.png");
        background-repeat: no-repeat; 
        background-position: center center; 
        background-size: cover; 
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        position: relative;
        min-height: 100vh;
      }
      .button-class1 {
        position: absolute;
        top: 75%;
        left: 60%;
        border: none;
        padding: 0;
        background: transparent;
        cursor: pointer;
        border-radius: 4px;
      }
      .button-class2 {
        position: absolute;
        top: 40%;
        left: 73%;
        border: none;
        padding: 0;
        background: transparent;
        cursor: pointer;
        border-radius: 4px;
      }
      .button-class3 {
        position: absolute;
        top: 75%;
        left: 87%;
        border: none;
        padding: 0;
        background: transparent;
        cursor: pointer;
        border-radius: 4px;
      }

      .button-class1 img {
          width: 300px;  
          height: auto;
          display: block;
      }
      .button-class2 img {
          width: 300px;  
          height: auto;
          display: block;
      }
      .button-class3 img {
          width: 250px;  
          height: auto;
          display: block;
      }
      .button-class1:hover {
          transform: translate(0%, 0%) scale(1.1);
          opacity: 0.2
      }
      .button-class2:hover {
          transform: translate(0%, 0%) scale(1.1);
          opacity: 0.2
      }
      .button-class3:hover {
          transform: translate(0%, 0%) scale(1.1);
          opacity: 0.2
      }
    </style>
  <script>
function clicc(page) {
    document.body.innerHTML = "<div class='section'><video autoplay muted><source src='yourvideo.mp4' type='video/mp4'></video></div>";

    setTimeout(function () {
        location.href = page;
    }, 3000); // 3000 ms = 3 seconds
}
</script>
  </head>
  <body>
   <button class="button-class1" onclick="clicc('consume.html')">
      <img src="button1.png" alt="Build Consume Button"/>
    </button>
    <button class="button-class2" onclick="clicc('devour.html')">
      <img src="button2.png" alt="Build Devour Button"/>
    </button>
    <button class="button-class3" onclick="clicc('sell.html')">
      <img src="button3.png" alt="Build Sell Button"/>
    </button>
  </body>
</html>
